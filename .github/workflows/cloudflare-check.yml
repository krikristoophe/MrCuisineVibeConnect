# Vérifie que les secrets Cloudflare de la CI fonctionnent (lancement manuel).
name: Cloudflare check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Token and D1 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 whoami
          npx --yes wrangler@4 d1 list | grep claudimix
          npx --yes wrangler@4 deployments list --name claudimix | head -5
